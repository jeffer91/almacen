appId: com.jeffersonvillarreal.almacenfamiliar
productName: Nicole Encajes
copyright: Copyright © 2026 Jefferson Villarreal

asar: true
compression: maximum

files:
  - app/**/*
  - web/**/*
  - package.json

directories:
  output: dist
  buildResources: build

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Nicole-Encajes-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nicole Encajes
  uninstallDisplayName: Nicole Encajes
  deleteAppDataOnUninstall: false
  runAfterFinish: true

publish: null
