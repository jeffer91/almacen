name: Verificar Nicole Encajes en producción

on:
  workflow_run:
    workflows:
      - Publicar Nicole Encajes en GitHub Pages
    types: [completed]
  workflow_dispatch:
  # Cada 3 días: mantiene despierto el proyecto gratuito de Supabase (se pausa tras 7 días sin uso).
  schedule:
    - cron: "17 13 */3 * *"

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verificar la lista de precios
        shell: bash
        run: |
          set -euxo pipefail
          base="https://jeffer91.github.io/almacen"
          curl -fLsS --retry 4 --retry-delay 3 --max-time 25 "$base/" -o /tmp/index.html
          grep -q 'data-profile="familia"' /tmp/index.html
          grep -q "viewer.js" /tmp/index.html
          for old in gloria; do
            curl -fLsS --max-time 25 "$base/$old/" -o /tmp/old.html
            grep -q 'url=../' /tmp/old.html
          done
          curl -fLsS --max-time 25 "$base/edgar/" -o /tmp/edgar.html
          grep -q 'id="edgar-protected" hidden' /tmp/edgar.html
          grep -q 'edgar/productos/' /tmp/edgar.html
          curl -fLsS --max-time 25 "$base/edgar/productos/" -o /tmp/products.html
          grep -q 'id="price-editor"' /tmp/products.html
          grep -q 'edgar/access.js' /tmp/products.html
          grep -q 'id="sheets-sync-dialog"' /tmp/products.html
          grep -q 'sheets-backup-core.js' /tmp/products.html
          curl -fLsS --max-time 25 "$base/sheets-backup-core.js" -o /tmp/sheet-backup.js
          grep -q 'NICOLE_SHEETS_BACKUP' /tmp/sheet-backup.js
          ! grep -q 'id="activation-editor"' /tmp/edgar.html
          curl -fLsS --max-time 25 "$base/edgar/access.js" -o /tmp/edgar-access.js
          grep -q 'EDGAR_EDIT_DEVICE' /tmp/edgar-access.js
          curl -fLsS --max-time 25 "$base/viewer.js" -o /tmp/viewer.js
          grep -q 'class="v-pencil"' /tmp/viewer.js
          grep -q 'legacy_references' /tmp/viewer.js
          ! grep -q 'fetch("./sheet-catalog.json"' /tmp/viewer.js
          curl -fLsS --retry 3 --max-time 25 "$base/ventas/?v=20261124-publico-2" -o /tmp/ventas.html
          ! grep -q 'id="loginForm"' /tmp/ventas.html
          grep -q 'id="salesSection">' /tmp/ventas.html
          grep -q 'id="edgar-protected" hidden' /tmp/ventas.html
          grep -q 'ventas/sales.js' /tmp/ventas.html
          grep -q 'Costo neto' /tmp/ventas.html
          curl -fLsS --max-time 25 "$base/catalogo-inteligente/" -o /tmp/smart.html
          grep -q 'id="editor"' /tmp/smart.html
          curl -fLsS --retry 3 --max-time 25 "$base/sincronizar/?v=20261124-publico-2" -o /tmp/sync.html
          ! grep -q 'id="loginForm"' /tmp/sync.html
          grep -q 'id="syncSection">' /tmp/sync.html
          grep -q 'sync.js?v=' /tmp/sync.html
          curl -fLsS --retry 3 --max-time 25 "$base/catalogo-excel/?v=20261124-publico-2" -o /tmp/excel.html
          ! grep -q 'id="login-form"' /tmp/excel.html
          grep -q 'id="catalog-content">' /tmp/excel.html
          grep -q 'catalogo.js?v=20261124-publico-2' /tmp/excel.html
          grep -q 'id="apply"' /tmp/sync.html
          grep -q 'id="bridge-save"' /tmp/sync.html
          grep -q 'id="sheet-direct"' /tmp/sync.html
          curl -fLsS --retry 3 --max-time 25 "$base/administrador/?v=20261124-admin2" -o /tmp/admin.html
          grep -q 'id="report"' /tmp/admin.html
          grep -q 'id="catalog-categories"' /tmp/admin.html
          curl -fLsS --retry 3 --max-time 25 "$base/administrador/cargas/?v=4" -o /tmp/bulk.html
          grep -q 'id="product-template"' /tmp/bulk.html
          grep -q 'id="price-template"' /tmp/bulk.html
          grep -q 'id="bulk-confirm"' /tmp/bulk.html
          grep -q 'bulk-core.js?v=4' /tmp/bulk.html
          curl -fLsS --max-time 25 "$base/administrador/cargas/bulk-core.js?v=4" -o /tmp/bulk-core.js
          grep -q 'Ingresa al menos un importe' /tmp/bulk-core.js
          curl -fLsS --max-time 25 "$base/administrador/cargas/bulk.js?v=5" -o /tmp/bulk.js
          grep -q 'importCommercialExcel' /tmp/bulk.js
          curl -fLsS --max-time 25 "$base/administrador/catalog-dashboard.js?v=2" -o /tmp/catalog-dashboard.js
          grep -q 'catalog-export-details' /tmp/catalog-dashboard.js
          curl -fLsS --max-time 25 "$base/administrador/dashboard.js?v=2" -o /tmp/dashboard.js
          grep -q 'exportSalesBackup' /tmp/dashboard.js
          curl -fLsS --max-time 25 "$base/sync-core.js" -o /tmp/sync-core.js
          grep -q 'parsePending' /tmp/sync-core.js
          curl -fLsS --max-time 25 "$base/sincronizar/sync.js?v=20261125-sync-4" -o /tmp/sync.js
          grep -q 'importExcel' /tmp/sync.js
          ! grep -q 'loginForm' /tmp/sync.js
          curl -fLsS --max-time 25 "$base/ventas/sales.js?v=20261124-publico-2" -o /tmp/sales.js
          grep -q 'addSalesBatch' /tmp/sales.js
          grep -q 'NICOLE_EDGAR_SESSION' /tmp/sales.js
          ! grep -q 'loginForm' /tmp/sales.js
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "$base/jefferson/")
          test "$code" = "404"
          curl -fLsS --max-time 25 "$base/config.js" -o /tmp/config.js
          grep -q "oppaviqjlyrnkpxjsfvo.supabase.co" /tmp/config.js
      - name: Comprobar API (módulos públicos y administración protegida)
        shell: bash
        run: |
          set -euo pipefail
          url="https://oppaviqjlyrnkpxjsfvo.supabase.co/functions/v1/catalog-api"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS --retry 3 --retry-delay 2 --max-time 25 "$url")
          test "$code" = "204"
          code=$(curl -sS -o /tmp/catalog -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"catalog"}' "$url")
          test "$code" = "200"
          grep -q '"ok":true' /tmp/catalog
          if grep -q '"costs"\|"suppliers"\|storage_path\|supplier_id' /tmp/catalog; then echo "La lista pública expone datos internos"; exit 1; fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"setPrice"}' "$url")
          test "$code" = "401"
          for action in syncSnapshot; do
            payload=$(printf '{"action":"%s","sale_date":"2026-11-20"}' "$action")
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data "$payload" "$url")
            test "$code" = "200"
          done
          for action in listSales addSale addSalesBatch voidSale exportSalesBackup smartCorrect smartCategories bootstrap saveSettings archiveProduct sheetStatus sheetSearch sheetProductGroups sheetProductDetails refreshSheetStagingManual refreshSheetStaging readSheetChanges configureSheetBridge probeSheetBridge importExcel importPricesExcel; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data "{\"action\":\"$action\"}" "$url")
            test "$code" = "401"
          done
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"importCommercialExcel","mode":"products","rows":[]}' "$url")
          test "$code" = "401"
          code=$(curl -sS -o /tmp/bridge-denied -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"pushLiveSheets","secret":""}' "$url")
          test "$code" = "403"
          echo "Módulos públicos disponibles; ventas, importación y administración protegidas."
