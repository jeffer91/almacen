name: Verificar Nicole Encajes en producción

on:
  workflow_run:
    workflows:
      - Publicar Nicole Encajes en GitHub Pages
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verificar los tres enlaces
        shell: bash
        run: |
          set -euo pipefail
          for person in edgar gloria jefferson; do
            url="https://jeffer91.github.io/almacen/$person/"
            echo "Verificando $url"
            curl -fLsS --retry 4 --retry-delay 3 --max-time 25 "$url" -o /tmp/"$person".html
            grep -q "data-profile=\"$person\"" /tmp/"$person".html
            grep -q "Nicole Encajes" /tmp/"$person".html
          done
          curl -fLsS --max-time 25 https://jeffer91.github.io/almacen/config.js -o /tmp/config.js
          grep -q "oppaviqjlyrnkpxjsfvo.supabase.co" /tmp/config.js
          curl -fLsS --max-time 25 https://jeffer91.github.io/almacen/assets/nicole-icon.svg -o /tmp/nicole-icon.svg
      - name: Comprobar API sin exponer las claves privadas
        shell: bash
        run: |
          set -euo pipefail
          url="https://oppaviqjlyrnkpxjsfvo.supabase.co/functions/v1/catalog-api"
          code=$(curl -sS -o /tmp/preflight -w "%{http_code}" -X OPTIONS --retry 3 --retry-delay 2 --max-time 25 "$url")
          test "$code" = "204"
          unauthenticated=$(curl -sS -o /tmp/rejected -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"bootstrap"}' "$url")
          test "$unauthenticated" = "401"
          grep -q 'Enlace de acceso inválido' /tmp/rejected
          echo "Sitio y API disponibles; la API rechazó acceso sin credenciales."
