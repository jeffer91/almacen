name: Verificar Nicole Encajes en producción

on:
  workflow_run:
    workflows:
      - Publicar Nicole Encajes en GitHub Pages
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verificar la lista de precios
        shell: bash
        run: |
          set -euo pipefail
          base="https://jeffer91.github.io/almacen"
          curl -fLsS --retry 4 --retry-delay 3 --max-time 25 "$base/" -o /tmp/index.html
          grep -q 'data-profile="familia"' /tmp/index.html
          grep -q "viewer.js" /tmp/index.html
          for old in edgar gloria; do
            curl -fLsS --max-time 25 "$base/$old/" -o /tmp/old.html
            grep -q 'url=../' /tmp/old.html
          done
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "$base/jefferson/")
          test "$code" = "404"
          curl -fLsS --max-time 25 "$base/config.js" -o /tmp/config.js
          grep -q "oppaviqjlyrnkpxjsfvo.supabase.co" /tmp/config.js
      - name: Comprobar API (lectura pública, escritura protegida)
        shell: bash
        run: |
          set -euo pipefail
          url="https://oppaviqjlyrnkpxjsfvo.supabase.co/functions/v1/catalog-api"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS --retry 3 --retry-delay 2 --max-time 25 "$url")
          test "$code" = "204"
          code=$(curl -sS -o /tmp/catalog -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"catalog"}' "$url")
          test "$code" = "200"
          grep -q '"ok":true' /tmp/catalog
          if grep -q '"costs"\|"suppliers"\|current_cost\|storage_path' /tmp/catalog; then echo "La lista pública expone datos internos"; exit 1; fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST --max-time 25 -H "Content-Type: application/json" --data '{"action":"setPrice"}' "$url")
          test "$code" = "401"
          echo "Lista pública disponible; la escritura exige la clave de la app de Jefferson."
