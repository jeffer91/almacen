<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';connect-src 'self' https://*.supabase.co;object-src 'none';base-uri 'self';form-action 'self'"><title>Nicole Encajes · Catálogo inteligente</title><link rel="stylesheet" href="../ventas/sales.css"><link rel="stylesheet" href="./smart.css"></head><body><header><a class="back" href="../ventas/">Ventas</a><a class="back" href="../sincronizar/">Sincronización</a><strong>Nicole Encajes</strong></header><main><h1>Catálogo inteligente</h1><p>Revisa y corrige las clasificaciones guardadas en Supabase. No modifica costos ni precios originales.</p><section class="panel"><div class="smart-tools"><input id="q" placeholder="Buscar producto, categoría o proveedor" aria-label="Buscar"><select id="family" aria-label="Familia"></select><select id="review" aria-label="Estado"><option value="">Todos</option><option value="review">Datos por revisar</option><option value="conflict">Conflictos</option></select><button id="reload" type="button" class="outline">Actualizar</button></div><p id="status" role="status"></p><div class="history"><table class="invoice-table"><thead><tr><th>Producto original</th><th>Familia</th><th>Variedad</th><th>Proveedor</th><th>Presentación</th><th>Costo</th><th>Precios</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div><div class="smart-tools"><button id="prev" type="button" class="outline">Anterior</button><span id="page"></span><button id="next" type="button" class="outline">Siguiente</button></div></section></main><dialog id="editor"><form id="edit"><h2>Corregir clasificación</h2><p id="original"></p><label>Nombre normalizado<input id="name" required maxlength="180"></label><label>Familia<select id="category" required></select></label><label>Variedad<input id="variety" required maxlength="100"></label><label>Proveedor<input id="provider" required maxlength="100"></label><p id="message" role="status"></p><div class="smart-tools"><button type="submit" id="save">Guardar corrección</button><button type="button" id="cancel" class="outline">Cancelar</button></div></form></dialog><script src="../config.js"></script><script src="../admin-session.js"></script><script src="../viewer-core.js"></script><script src="../ventas/sales-catalog.js?v=8"></script><script src="./smart.js"></script></body></html>
